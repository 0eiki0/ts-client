[package]
name = "ts-client"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "TeamSpeak-Client für Windows, macOS und Linux (Oberfläche der TS3 Web Bridge)"
repository = "https://github.com/0eiki0/ts-client"

[dependencies]
tsclientlib = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5", default-features = false, features = ["audio"] }
tsproto-packets = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5" }
audiopus = "0.3.0-rc.0"
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
hickory-resolver = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
sha2 = "0.10"
wry = "0.57.3"
tao = "0.37.3"
dirs = "7.0.0"
device_query = "4.0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
