# Link libopus statically (it is built from the bundled source).
[env]
LIBOPUS_STATIC = "1"

# For fully static musl binaries: libopus needs libm, which lives in musl's libc
# and must come after libopus on the linker command line.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "link-arg=-lc"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "link-arg=-lc"]
